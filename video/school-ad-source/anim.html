<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:V;src:url(Vazirmatn-Medium.woff2);font-weight:500}
@font-face{font-family:V;src:url(Vazirmatn-Bold.woff2);font-weight:700}
@font-face{font-family:V;src:url(Vazirmatn-ExtraBold.woff2);font-weight:800}
@font-face{font-family:V;src:url(Vazirmatn-Black.woff2);font-weight:900}
:root{--navy:#0F2A4A;--blue:#1E6FD9;--green:#18A558;--red:#E5484D;--yellow:#FFC93C;--wall:#E4ECF5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--wall);font-family:V,sans-serif}
#stage{position:absolute;inset:0}
svg{position:absolute;inset:0}
#btn svg{position:static;flex:none}
.abs{position:absolute}
#title{left:0;right:0;top:175px;text-align:center}
#title span{display:inline-block;font-weight:900;font-size:76px;color:var(--navy);background:var(--yellow);padding:6px 38px 16px;border-radius:26px;box-shadow:0 10px 0 rgba(15,42,74,.18)}
#cap{left:60px;right:60px;top:1268px;text-align:center}
#cap span{display:inline-block;font-weight:800;font-size:46px;line-height:1.55;color:#fff;background:rgba(15,42,74,.88);padding:10px 34px 16px;border-radius:24px}
.bub{font-weight:800;font-size:44px;color:var(--navy);background:#fff;border:6px solid var(--red);border-radius:30px;padding:10px 30px 16px;white-space:nowrap;box-shadow:0 12px 24px rgba(0,0,0,.15);transform-origin:center}
.bub b{color:var(--red)}
#panel{left:250px;top:330px;width:770px;height:740px;background:#fff;border-radius:34px;box-shadow:0 30px 60px rgba(15,42,74,.35);overflow:hidden;transform-origin:50% 50%}
#phead{height:96px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font-weight:800;font-size:34px}
#phead i{font-style:normal;background:var(--blue);padding:4px 22px 10px;border-radius:16px;font-size:30px}
.dots{display:flex;gap:10px;direction:ltr}.dots b{width:16px;height:16px;border-radius:50%;background:#ff6159;display:block}.dots b:nth-child(2){background:#ffbd2e}.dots b:nth-child(3){background:#28c941}
.feat{position:absolute;left:0;right:0;top:96px;bottom:0;padding:30px 36px 30px 120px}
.row{display:flex;align-items:center;justify-content:space-between;height:96px;border-bottom:3px solid #EEF2F7;font-weight:700;font-size:38px;color:var(--navy)}
.av{width:62px;height:62px;border-radius:50%;background:#D6E4F5;margin-left:22px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--blue);font-weight:900}
.nm{display:flex;align-items:center}
.chk{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;font-weight:900;transform-origin:center}
.ok{background:var(--green)}.no{background:var(--red)}
.chip{font-size:30px;font-weight:800;padding:4px 22px 10px;border-radius:40px;color:#fff;transform-origin:center}
.amt{font-size:32px;color:#5A6B82;font-weight:700;margin-left:auto;margin-right:24px;direction:rtl}
.sum{margin-top:26px;font-weight:800;font-size:36px;color:var(--navy)}
.bar{height:40px;border-radius:20px;background:#EEF2F7;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#2BC46F);border-radius:20px}
#cta{left:0;top:0;width:1080px;height:1920px;background:linear-gradient(160deg,#0F2A4A 0%,#123B6B 55%,#1E6FD9 100%);color:#fff;text-align:center}
.cta-b{position:absolute;left:0;right:0;text-align:center}
#btn{display:inline-flex;flex-direction:row;align-items:center;gap:22px;white-space:nowrap;background:#25B867;color:#fff;font-weight:900;font-size:56px;padding:22px 54px 32px;border-radius:70px;box-shadow:0 14px 0 #138A47;transform-origin:center}
.pill{display:inline-block;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35);font-weight:800;font-size:40px;padding:8px 30px 14px;border-radius:50px;margin:10px}
</style>
</head>
<body>
<div id="stage">
<svg id="bg" viewBox="0 0 1080 1920" width="1080" height="1920">
 <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD0FF"/><stop offset="1" stop-color="#DDF1FF"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#FFE58A" stop-opacity=".9"/><stop offset="1" stop-color="#FFE58A" stop-opacity="0"/></radialGradient>
 </defs>
 <rect width="1080" height="1920" fill="#DCE5F0"/>

 </g>
 <!-- bookshelf -->
 <g transform="translate(760,700)">
  <rect width="250" height="18" fill="#9C6B43"/><rect y="150" width="250" height="18" fill="#9C6B43"/>
  <g transform="translate(20,-110)"><rect width="34" height="110" fill="#E5484D"/><rect x="40" width="28" height="110" fill="#1E6FD9"/><rect x="74" y="12" width="32" height="98" fill="#FFC93C"/><rect x="112" width="26" height="110" fill="#18A558"/><rect x="150" y="20" width="60" height="90" rx="4" fill="#0F2A4A" transform="rotate(12 150 110)"/></g>
  <g transform="translate(26,40)"><rect width="30" height="110" fill="#18A558"/><rect x="36" y="10" width="34" height="100" fill="#0F2A4A"/><rect x="76" width="26" height="110" fill="#E5484D"/><path d="M150,110 Q150,50 190,40 Q230,50 230,110 Z" fill="#7FB77E"/></g>
 </g>
 <!-- plant -->
 <g transform="translate(110,1330)">
  <path d="M0,-170 Q-60,-260 -20,-330 Q10,-250 0,-170Z M0,-170 Q50,-270 100,-280 Q70,-200 0,-170Z M0,-170 Q-90,-200 -110,-250 Q-40,-240 0,-170Z" fill="#2F9E6B"/>
  <path d="M-55,-170 L55,-170 L40,0 L-40,0 Z" fill="#E27D4A"/>
 </g>
</svg>

<!-- characters & desk layer -->
<svg id="fg" viewBox="0 0 1080 1920" width="1080" height="1920">
 <defs>
  <g id="paperS"><rect x="-60" y="-14" width="120" height="14" fill="#fff" stroke="#C8D2DE" stroke-width="2"/></g>
 </defs>
 <g id="pr"></g>
 <g id="cs"><g id="csBody"></g>
  <g id="bulb" opacity="0"><g transform="translate(170,140)"><circle cx="0" cy="-1120" r="90" fill="url(#glow)"/>
   <path d="M-32,-1130 A40,40 0 1 1 32,-1130 Q20,-1110 18,-1092 L-18,-1092 Q-20,-1110 -32,-1130Z" fill="#FFD43B" stroke="#E0A800" stroke-width="5"/>
   <rect x="-18" y="-1090" width="36" height="22" rx="5" fill="#8C97A6"/></g></g>
 </g>
 <!-- desk -->
 <g id="desk">
  <rect x="120" y="1100" width="840" height="34" rx="10" fill="#B07A4F"/>

  <rect x="190" y="1170" width="300" height="220" rx="10" fill="#8A5A36"/>
  <rect x="590" y="1170" width="300" height="220" rx="10" fill="#8A5A36"/>
  <circle cx="340" cy="1280" r="12" fill="#D8B03A"/><circle cx="740" cy="1280" r="12" fill="#D8B03A"/>
 </g>
 <g id="stacks"></g>
 <g id="fly"></g>
 <!-- phone on desk -->
 <g id="phone" transform="translate(830,1100)">
  <rect x="-56" y="-44" width="112" height="44" rx="12" fill="#0F2A4A"/>

  <g id="ring" stroke="#E5484D" stroke-width="7" fill="none" stroke-linecap="round"><path d="M-80,-90 Q-96,-70 -84,-50"/><path d="M80,-90 Q96,-70 84,-50"/><path d="M-102,-104 Q-124,-72 -106,-40"/><path d="M102,-104 Q124,-72 106,-40"/></g>
 </g>
 <!-- tea cup -->

  <path d="M34,-48 Q58,-40 30,-16" fill="none" stroke="#fff" stroke-width="8"/>
  <g id="steam" stroke="#B9C6D6" stroke-width="6" fill="none" stroke-linecap="round"><path d="M-12,-74 Q-24,-96 -10,-116"/><path d="M12,-74 Q0,-96 14,-116"/></g>
 </g>

 <g id="spark"></g>
</svg>

<div id="bubbles"></div>

<div id="panel" class="abs">
 <div id="phead"><span id="ptitle">سیستم مدیریت مکتب</span><div class="dots"><b></b><b></b><b></b></div></div>
 <div class="feat" id="f0"></div><div class="feat" id="f1"></div><div class="feat" id="f2"></div><div class="feat" id="f3"></div><div class="feat" id="f4"></div>
</div>

<div id="title" class="abs"><span id="titleT"></span></div>

<div id="cta" class="abs">
 <svg viewBox="0 0 1080 1920" width="1080" height="1920" style="position:absolute;inset:0">
  <g opacity=".08" fill="#fff"><circle cx="980" cy="260" r="220"/><circle cx="80" cy="1500" r="260"/></g>
  <g id="school" transform="translate(540,560)">
   <path d="M-230,0 L0,-150 L230,0Z" fill="#FFC93C"/>

   <g fill="#8FD0FF"><rect x="-170" y="40" width="70" height="60" rx="6"/><rect x="100" y="40" width="70" height="60" rx="6"/><rect x="-170" y="130" width="70" height="60" rx="6"/><rect x="100" y="130" width="70" height="60" rx="6"/></g>
   <circle cy="-60" r="34" fill="#fff"/><path d="M0,-60 L0,-82 M0,-60 L16,-52" stroke="#0F2A4A" stroke-width="6" stroke-linecap="round"/>
   <rect x="-4" y="-260" width="8" height="110" fill="#fff"/><path d="M4,-260 L80,-238 L4,-216Z" fill="#E5484D"/>
  </g>
 </svg>
 <div class="cta-b" id="ctaT1" style="top:840px;font-weight:900;font-size:78px;line-height:1.35">سیستم هوشمند<br>مدیریت مکتب</div>
 <div class="cta-b" id="ctaT2" style="top:1070px"><span class="pill">حاضری</span><span class="pill">فیس</span><span class="pill">نتایج و شُقه</span><br><span class="pill">پیام به والدین</span><span class="pill">حساب مالی</span></div>
 <div class="cta-b" id="ctaT3" style="top:1270px"><div id="btn"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#fff"/><path d="M22,18 Q16,20 17,28 Q20,40 32,47 Q40,51 46,46 L46,40 L38,36 L34,40 Q26,36 24,28 L28,24 L24,16Z" fill="#25B867"/></svg><span>همین حالا پیام بدهید</span></div></div>
 <div class="cta-b" id="ctaT4" style="top:1440px;font-weight:800;font-size:44px;color:#FFC93C">نمایش رایگان برای مکتب شما</div>
</div>

<script>
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const S=(el,x=0,y=0,s=1,r=0,cx=0,cy=0)=>el.setAttribute('transform',`translate(${x},${y}) rotate(${r},${cx},${cy}) scale(${s})`);
const H=(el,x=0,y=0,s=1,r=0)=>{el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`};
const O=(el,o)=>{el.style.opacity=o};
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

// ---------- character generator (flat style) ----------
function man(p,o){
 const SK='#F3BC93',SKD='#E2A178',HAIR='#1B2233',HL='#3B4766';
 const suit=o.suit, TOP=suit?'#26395E':'#F7F9FB', TOPD=suit?'#1A2946':'#D9E1EA', PANTS=suit?'#1F2D4A':'#1E2638';
 const arm=(id,sx)=>{const x1=sx*90,x2=sx*126,x3=sx*120;
  return `<g id="${p}${id}">`+
   (suit?'':`<path d="M${x1},-780 L${x2},-620 L${x3},-490" fill="none" stroke="#D3DBE5" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>`)+
   `<path d="M${x1},-780 L${x2},-620 L${x3},-490" fill="none" stroke="${TOP}" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>`+
   (suit?`<circle cx="${x3}" cy="-486" r="20" fill="#F7F9FB"/>`:'')+
   `<circle cx="${sx*120}" cy="-466" r="23" fill="${SK}"/>`+
   (o.laptop&&sx<0?`<g id="${p}Lap"><rect x="-215" y="-525" width="150" height="104" rx="12" fill="#AEB9C8"/><rect x="-205" y="-517" width="130" height="84" rx="7" fill="#1E73E8"/><rect x="-190" y="-500" width="70" height="10" rx="5" fill="#fff" opacity=".7"/><rect x="-190" y="-482" width="100" height="10" rx="5" fill="#fff" opacity=".45"/></g>`:'')+
   `</g>`};
 const leg=(id,sx)=>`<g id="${p}${id}"><rect x="${sx<0?-52:6}" y="-452" width="46" height="424" rx="16" fill="${PANTS}"/><path d="M${sx<0?-54:6},-36 L${sx<0?-6:54},-36 Q${sx<0?0:62},-2 ${sx<0?-18:40},0 L${sx<0?-70:-4},0 Q${sx<0?-74:-8},-26 ${sx<0?-54:6},-36Z" fill="#12151C"/></g>`;
 const hair=o.hair==2
  ? `<path d="M-68,-896 Q-86,-992 -20,-1032 Q42,-1052 74,-992 Q82,-950 68,-896 Q60,-940 40,-955 Q10,-968 -20,-960 Q-48,-952 -58,-928Z" fill="${HAIR}"/><path d="M34,-1034 Q-44,-1044 -70,-956 Q-40,-1004 34,-1010Z" fill="${HAIR}"/><g fill="none" stroke="${HL}" stroke-width="6" stroke-linecap="round"><path d="M14,-1032 Q-30,-1026 -52,-984"/><path d="M34,-1012 Q-8,-1004 -30,-972"/></g>`
  : `<path d="M-66,-898 Q-76,-950 -60,-988 Q-40,-1036 10,-1040 Q70,-1040 78,-986 Q82,-950 68,-898 Q66,-935 52,-950 Q40,-962 20,-958 Q-10,-952 -30,-966 Q-46,-948 -56,-930 Q-62,-915 -66,-898Z" fill="${HAIR}"/><path d="M-52,-1000 Q-10,-1052 52,-1034 Q80,-1020 80,-988 Q52,-1014 10,-1012 Q-20,-1010 -52,-1000Z" fill="${HAIR}"/><g fill="none" stroke="${HL}" stroke-width="6" stroke-linecap="round"><path d="M-24,-1030 Q20,-1044 54,-1012"/><path d="M-42,-1004 Q0,-1024 40,-996"/></g>`;
 let torso;
 if(suit){
  torso=`<path d="M-106,-440 L-112,-705 Q-110,-792 -44,-808 L44,-808 Q110,-792 112,-705 L106,-440Z" fill="${TOP}"/>
  <path d="M60,-804 Q110,-792 112,-705 L106,-440 L74,-440 Q84,-620 60,-804Z" fill="${TOPD}" opacity=".6"/>
  <path d="M-40,-808 L0,-688 L40,-808Z" fill="#F7F9FB"/>
  <path d="M0,-794 L-12,-778 L-9,-702 L0,-686 L9,-702 L12,-778Z" fill="#1E73E8"/><path d="M-11,-802 L11,-802 L8,-784 L-8,-784Z" fill="#175FC2"/>
  <path d="M-44,-808 L-4,-688 L-28,-700 L-64,-772Z" fill="${TOPD}"/><path d="M44,-808 L4,-688 L28,-700 L64,-772Z" fill="${TOPD}"/>
  <path d="M0,-688 L0,-440" stroke="${TOPD}" stroke-width="4"/><circle cx="0" cy="-620" r="6" fill="${TOPD}"/><circle cx="0" cy="-555" r="6" fill="${TOPD}"/>
  <rect x="44" y="-650" width="42" height="7" rx="3" fill="${TOPD}"/><path d="M52,-650 L60,-664 L70,-650Z" fill="#F7F9FB"/>`;
 } else {
  torso=`<path d="M-100,-440 L-104,-705 Q-102,-792 -42,-806 L42,-806 Q102,-792 104,-705 L100,-440Z" fill="${TOP}" stroke="#D3DBE5" stroke-width="3"/>
  <path d="M58,-802 Q102,-792 104,-705 L100,-440 L72,-440 Q82,-620 58,-802Z" fill="${TOPD}" opacity=".7"/>
  <path d="M-20,-806 L0,-772 L20,-806Z" fill="${SK}"/>
  <path d="M-42,-806 L-4,-768 L-24,-792Z M42,-806 L4,-768 L24,-792Z" fill="#fff" stroke="#C9D2DD" stroke-width="3" stroke-linejoin="round"/>
  <path d="M0,-770 L0,-460" stroke="#D3DBE5" stroke-width="3"/><g fill="#C9D2DD"><circle cy="-720" r="4"/><circle cy="-650" r="4"/><circle cy="-580" r="4"/><circle cy="-510" r="4"/></g>
  <rect x="-74" y="-690" width="40" height="42" rx="4" fill="none" stroke="#D3DBE5" stroke-width="3"/>
  <rect x="-100" y="-466" width="200" height="22" fill="#1E2638"/><rect x="-14" y="-468" width="28" height="26" rx="4" fill="#AEB9C8"/>`;
 }
 const head=`<g id="${p}Head">
  <ellipse cx="-62" cy="-905" rx="12" ry="19" fill="${SKD}"/><ellipse cx="62" cy="-905" rx="12" ry="19" fill="${SKD}"/>
  <ellipse cx="0" cy="-908" rx="62" ry="76" fill="${SK}"/>
  <path d="M-58,-880 Q-40,-832 0,-832 Q40,-832 58,-880 Q40,-846 0,-844 Q-40,-846 -58,-880Z" fill="${SKD}" opacity=".45"/>
  <g fill="#F08C7A" opacity=".28"><circle cx="-36" cy="-878" r="12"/><circle cx="36" cy="-878" r="12"/></g>
  ${hair}
  <rect id="${p}BL" x="-40" y="-942" width="28" height="8" rx="4" fill="${HAIR}"/><rect id="${p}BR" x="12" y="-942" width="28" height="8" rx="4" fill="${HAIR}"/>
  <g id="${p}EO"><ellipse cx="-25" cy="-912" rx="6.5" ry="8.5" fill="${HAIR}"/><ellipse cx="25" cy="-912" rx="6.5" ry="8.5" fill="${HAIR}"/><circle cx="-23" cy="-915" r="2" fill="#fff"/><circle cx="27" cy="-915" r="2" fill="#fff"/></g>
  <g id="${p}EC" opacity="0" fill="none" stroke="${HAIR}" stroke-width="5" stroke-linecap="round"><path d="M-34,-910 Q-25,-921 -16,-910"/><path d="M16,-910 Q25,-921 34,-910"/></g>
  <path d="M2,-902 Q-7,-884 6,-881" fill="none" stroke="${SKD}" stroke-width="5" stroke-linecap="round"/>
  <path id="${p}MS" d="M-14,-858 Q0,-868 14,-858" fill="none" stroke="#8A3B2A" stroke-width="5" stroke-linecap="round" opacity="0"/>
  <path id="${p}MN" d="M-16,-866 Q0,-853 16,-866" fill="none" stroke="#8A3B2A" stroke-width="5" stroke-linecap="round"/>
  <path id="${p}MH" d="M-20,-868 Q0,-842 20,-868Z" fill="#8A2E22" opacity="0"/>
  <g id="${p}SW" fill="#7EC8F5" opacity="0"><path d="M74,-960 Q63,-940 74,-932 Q85,-940 74,-960Z"/><path d="M-80,-975 Q-90,-957 -80,-950 Q-70,-957 -80,-975Z"/></g>
 </g>`;
 return leg('LegL',-1)+leg('LegR',1)+arm('ArmL',-1)+arm('ArmR',1)+`<rect x="-22" y="-844" width="44" height="46" fill="${SKD}"/>`+torso+head;
}
$('pr').innerHTML=man('pr',{suit:true,hair:1});
$('csBody').innerHTML=man('cs',{suit:false,hair:2,laptop:true});
function face(p,mode,t,blinkOff){ // mode: sad|neutral|happy
 const bl=((t+blinkOff)%3.9)<.12;
 O($(p+'EO'),mode==='happy'||bl?0:1); O($(p+'EC'),mode==='happy'||bl?1:0);
 O($(p+'MS'),mode==='sad'?1:0); O($(p+'MN'),mode==='neutral'?1:0); O($(p+'MH'),mode==='happy'?1:0);

@font-face{font-family:V;src:url(Vazirmatn-Black.woff2);font-weight:900}
:root{--navy:#0F2A4A;--blue:#1E6FD9;--green:#18A558;--red:#E5484D;--yellow:#FFC93C;--wall:#E4ECF5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--wall);font-family:V,sans-serif}
#stage{position:absolute;inset:0}
svg{position:absolute;inset:0}
#btn svg{position:static;flex:none}
.abs{position:absolute}
#title{left:0;right:0;top:175px;text-align:center}
#title span{display:inline-block;font-weight:900;font-size:76px;color:var(--navy);background:var(--yellow);padding:6px 38px 16px;border-radius:26px;box-shadow:0 10px 0 rgba(15,42,74,.18)}
#cap{left:60px;right:60px;top:1268px;text-align:center}
#cap span{display:inline-block;font-weight:800;font-size:46px;line-height:1.55;color:#fff;background:rgba(15,42,74,.88);padding:10px 34px 16px;border-radius:24px}
.bub{font-weight:800;font-size:44px;color:var(--navy);background:#fff;border:6px solid var(--red);border-radius:30px;padding:10px 30px 16px;white-space:nowrap;box-shadow:0 12px 24px rgba(0,0,0,.15);transform-origin:center}
.bub b{color:var(--red)}
#panel{left:250px;top:330px;width:770px;height:740px;background:#fff;border-radius:34px;box-shadow:0 30px 60px rgba(15,42,74,.35);overflow:hidden;transform-origin:50% 50%}
#phead{height:96px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font-weight:800;font-size:34px}
#phead i{font-style:normal;background:var(--blue);padding:4px 22px 10px;border-radius:16px;font-size:30px}
.dots{display:flex;gap:10px;direction:ltr}.dots b{width:16px;height:16px;border-radius:50%;background:#ff6159;display:block}.dots b:nth-child(2){background:#ffbd2e}.dots b:nth-child(3){background:#28c941}
.feat{position:absolute;left:0;right:0;top:96px;bottom:0;padding:30px 36px 30px 120px}
.row{display:flex;align-items:center;justify-content:space-between;height:96px;border-bottom:3px solid #EEF2F7;font-weight:700;font-size:38px;color:var(--navy)}
.av{width:62px;height:62px;border-radius:50%;background:#D6E4F5;margin-left:22px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--blue);font-weight:900}
.nm{display:flex;align-items:center}
.chk{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;font-weight:900;transform-origin:center}
.ok{background:var(--green)}.no{background:var(--red)}
.chip{font-size:30px;font-weight:800;padding:4px 22px 10px;border-radius:40px;color:#fff;transform-origin:center}
.amt{font-size:32px;color:#5A6B82;font-weight:700;margin-left:auto;margin-right:24px;direction:rtl}
.sum{margin-top:26px;font-weight:800;font-size:36px;color:var(--navy)}
.bar{height:40px;border-radius:20px;background:#EEF2F7;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#2BC46F);border-radius:20px}
#cta{left:0;top:0;width:1080px;height:1920px;background:linear-gradient(160deg,#0F2A4A 0%,#123B6B 55%,#1E6FD9 100%);color:#fff;text-align:center}
.cta-b{position:absolute;left:0;right:0;text-align:center}
#btn{display:inline-flex;flex-direction:row;align-items:center;gap:22px;white-space:nowrap;background:#25B867;color:#fff;font-weight:900;font-size:56px;padding:22px 54px 32px;border-radius:70px;box-shadow:0 14px 0 #138A47;transform-origin:center}
.pill{display:inline-block;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35);font-weight:800;font-size:40px;padding:8px 30px 14px;border-radius:50px;margin:10px}

<script>
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const S=(el,x=0,y=0,s=1,r=0,cx=0,cy=0)=>el.setAttribute('transform',`translate(${x},${y}) rotate(${r},${cx},${cy}) scale(${s})`);
const H=(el,x=0,y=0,s=1,r=0)=>{el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`};
const O=(el,o)=>{el.style.opacity=o};
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

// ---------- build dynamic content ----------
const NS='http://www.w3.org/2000/svg';
const stacks=$('stacks'), fly=$('fly'), spark=$('spark');
const stackDefs=[[260,14],[380,18],[700,16],[600,10]];
stackDefs.forEach(([x,n],i)=>{const g=document.createElementNS(NS,'g');g.id='st'+i;
